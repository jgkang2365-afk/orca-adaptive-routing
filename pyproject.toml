[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-adaptive-routing"
version = "0.2.0"
description = "Policy-driven Orca Coordinator routing and worker lifecycle adapter"
requires-python = ">=3.11"

[project.scripts]
orca-adaptive = "adaptive_coordinator.cli:main"

[tool.setuptools.packages.find]
include = ["adaptive_coordinator*"]
